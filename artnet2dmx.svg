<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- Material 2 Dark Theme Subtle Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#252525"/>
      <stop offset="100%" stop-color="#181818"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base (Material Dark Surface) -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bgGrad)" stroke="#2C2C2C" stroke-width="4"/>

  <!-- Subtle Inner Ring -->
